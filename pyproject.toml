[project]
name = "basednews-pipeline"
version = "0.1.0"
description = "BasedNews data/ML pipeline: ingestion, event matching, LLM pairwise judging, active Bayesian rating"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "trafilatura>=1.8",
    "openai>=1.40",
    "pyarrow>=17",
    "boto3>=1.35.50",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = ["pytest>=8"]
ml = ["sentence-transformers>=3.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
