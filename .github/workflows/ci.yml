# CI: unit tests + lint for the pipeline, production build of the site. No secrets, no AWS, no paid calls.
# Deployment (image → ECR, site → S3, terraform apply) is added with the infrastructure (ADR-010, docs/DEPLOY.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m pytest -q
      - run: uvx ruff check pipeline tests --select F

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
